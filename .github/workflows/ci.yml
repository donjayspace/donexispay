name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/donexispay?schema=public
      APP_SECRET: ci-only-secret-value-that-is-longer-than-32-characters
      PAYMENTS_LIVE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Export generated lockfile during bootstrap
        run: |
          echo "PNPM_LOCKFILE_BEGIN"
          cat pnpm-lock.yaml
          echo "PNPM_LOCKFILE_END"
      - name: Generate Prisma Client
        run: pnpm run db:generate
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
